name: Build Tlapaleria LEO (Win, Debian, Fedora)

on:
  # Se dispara al subir un tag como v1.7.0, v1.7.1, etc.
  push:
    tags:
      - 'v*.*.*'
  # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_API_URL: "https://TlapaleriaLeo.local/api"
  RENDERER_VITE_API_URL: "https://TlapaleriaLeo.local/api"

jobs:
  build_pos:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Instalar dependencias de sistema para .rpm (Fedora) y .deb (Debian)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: 4. Instalar paquetes NPM
        run: npm ci

      - name: 5. Compilar Instalador Windows (.exe)
        if: matrix.os == 'windows-latest'
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build:win

      - name: 6. Compilar Instaladores Debian (.deb) y Fedora (.rpm)
        if: matrix.os == 'ubuntu-latest'
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build:linux

      - name: 7. Subir instaladores como Artefactos (Descarga directa en Actions)
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          path: |
            dist_installers/*.exe
            dist_installers/*.deb
            dist_installers/*.rpm

      - name: 8. Crear Release en GitHub (Solo cuando subes un tag v*.*.*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_installers/*.exe
            dist_installers/*.deb
            dist_installers/*.rpm